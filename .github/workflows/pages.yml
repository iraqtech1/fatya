name: Deploy Fatya to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: fatya-ubuntu24-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
      - name: Install dependencies when needed
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_MODE: preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 1000
